{% extends 'base.html' %}
{% block title %}Sign In — CineScope{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">CineScope</div>
        <p class="auth-subtitle">Sign in to your account</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label class="form-label-dark" for="username_or_email">Username or Email</label>
                <input type="text" class="form-control form-control-dark" id="username_or_email" name="username_or_email" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label-dark" for="password">Password</label>
                <input type="password" class="form-control form-control-dark" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-cinescope w-100 mb-3">Sign In</button>
        </form>

        <p class="text-center" style="color: var(--text-muted); font-size: 0.8rem;">
            New here? <a href="{{ url_for('auth.register') }}">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
