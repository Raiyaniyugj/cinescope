{% extends 'base.html' %}
{% block title %}Create Account — CineScope{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">CineScope</div>
        <p class="auth-subtitle">Track films you've watched. Save those you want to see.</p>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
                <label class="form-label-dark" for="username">Username</label>
                <input type="text" class="form-control form-control-dark" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label-dark" for="email">Email address</label>
                <input type="email" class="form-control form-control-dark" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label class="form-label-dark" for="password">Password</label>
                <input type="password" class="form-control form-control-dark" id="password" name="password" required>
            </div>
            <div class="mb-4">
                <label class="form-label-dark" for="confirm_password">Confirm Password</label>
                <input type="password" class="form-control form-control-dark" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn btn-cinescope w-100 mb-3">Create Account</button>
        </form>

        <div class="text-center mb-3">
            <span style="color: var(--text-muted); font-size: 0.8rem;">OR</span>
        </div>
        
        <button id="googleSignInBtn" class="btn btn-light w-100 mb-3 d-flex align-items-center justify-content-center gap-2" style="font-weight: 600; color: #444;">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
            Sign up with Google
        </button>

        <p class="text-center" style="color: var(--text-muted); font-size: 0.8rem;">
            Already a member? <a href="{{ url_for('auth.login') }}">Sign in</a>
        </p>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "{{ firebase_config.apiKey }}",
    authDomain: "{{ firebase_config.authDomain }}",
    projectId: "{{ firebase_config.projectId }}",
    storageBucket: "{{ firebase_config.storageBucket }}",
    messagingSenderId: "{{ firebase_config.messagingSenderId }}",
    appId: "{{ firebase_config.appId }}"
  };

  let app, auth, provider;
  if (firebaseConfig.apiKey && firebaseConfig.apiKey.length > 5) {
      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      provider = new GoogleAuthProvider();
  } else {
      console.warn("Firebase config is missing or invalid. Google Sign-In will not work.");
  }

  const btn = document.getElementById('googleSignInBtn');
  if (btn) {
      btn.addEventListener('click', async () => {
          if (!auth) {
              alert("Firebase is not configured yet. Please wait for the admin to configure it.");
              return;
          }
          
          btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Signing up...`;
          btn.disabled = true;
          
          try {
              const result = await signInWithPopup(auth, provider);
              const idToken = await result.user.getIdToken();
              
              const response = await fetch("{{ url_for('auth.firebase_login') }}", {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ idToken })
              });
              
              const data = await response.json();
              if (data.success) {
                  window.location.href = data.redirect;
              } else {
                  alert("Signup failed: " + (data.error || "Unknown error"));
                  btn.innerHTML = `Sign up with Google`;
                  btn.disabled = false;
              }
          } catch (error) {
              console.error(error);
              alert("Google Sign-Up failed.");
              btn.innerHTML = `Sign up with Google`;
              btn.disabled = false;
          }
      });
  }
</script>
{% endblock %}
